# Baseline GaitSet/GaitPart Configuration
# =========================================

# Reproducibility
seed: 42

# Dataset
dataset:
  data_mode: "sample"
  name: "OccGait"
  root: "data/OccGait"
  resolution: [64, 44]  # H x W
  sequence_length: 30
  num_sample_identities: 4
  train_subjects: [1, 74]    # IDs 001-074
  test_subjects: [75, 124]   # IDs 075-124
  gallery_sequences: ["NM01", "NM02"]
  probe_sequences: ["NM03", "NM04", "CA01", "CA02", "CO01", "CO02", "ST01", "ST02"]
  views: 8
  occlusion_categories: ["NO", "CA", "CO", "ST"]
  num_workers: 4

# Model
model:
  backbone: "resnet50"  # PRIMARY backbone
  pretrained: true
  input_channels: 1
  feature_dim: 256
  num_parts: 4  # head, torso, upper_legs, lower_legs
  part_ranges:  # vertical percentage ranges
    - [0.0, 0.15]    # head
    - [0.15, 0.45]   # torso
    - [0.45, 0.70]   # upper legs
    - [0.70, 1.0]    # lower legs
  attention:
    type: "cbam"  # "se", "cbam", or "none"
    reduction_ratio: 16

# Training
training:
  batch_size: [8, 16]  # [num_subjects, num_sequences_per_subject]
  total_iterations: 40000
  optimizer:
    type: "sgd"
    lr: 0.1
    momentum: 0.9
    weight_decay: 5.0e-4
  scheduler:
    type: "step"
    milestones: [20000, 30000]
    gamma: 0.1
  warmup:
    iterations: 500
    type: "linear"
  gradient_clip:
    max_norm: 10.0
  checkpoint_interval: 5000

# Loss
loss:
  triplet:
    margin: 0.2
    mining: "hard"  # "hard", "semi-hard"
    weight: 1.0
  center:
    weight: 0.005
    momentum: 0.5

# Augmentation
augmentation:
  random_occlusion:
    enabled: false  # Disabled for baseline
  affine:
    enabled: true
    rotation: 15
    scale: [0.9, 1.1]
    shear: 0.1
    translation: 0.05
  temporal:
    enabled: true
    frame_drop_prob: 0.1
    frame_dup_prob: 0.1

# Evaluation
evaluation:
  metrics: ["rank1", "rank5", "cmc", "map"]
  visualization: true

# Logging
logging:
  backend: "wandb"  # "wandb" or "tensorboard"
  project: "gait-recognition"
  run_name: "baseline-resnet50"
  log_interval: 100

# Hardware
hardware:
  device: "cuda"
  mixed_precision: true
  compile: true  # torch.compile
