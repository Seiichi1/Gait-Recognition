# Occlusion-Aware Full Model Configuration
# ==========================================

# Reproducibility
seed: 42

# Dataset
dataset:
  data_mode: "sample"
  name: "OccGait"
  root: "data/OccGait"
  resolution: [64, 44]
  sequence_length: 30
  num_sample_identities: 4
  train_subjects: [1, 74]
  test_subjects: [75, 124]
  gallery_sequences: ["NM01", "NM02"]
  probe_sequences: ["NM03", "NM04", "CA01", "CA02", "CO01", "CO02", "ST01", "ST02"]
  views: 8
  occlusion_categories: ["NO", "CA", "CO", "ST"]
  num_workers: 4

# Model
model:
  backbone: "resnet50"
  pretrained: true
  input_channels: 1
  feature_dim: 256
  num_parts: 4
  part_ranges:
    - [0.0, 0.15]
    - [0.15, 0.45]
    - [0.45, 0.70]
    - [0.70, 1.0]
  attention:
    type: "cbam"
    reduction_ratio: 16
  
  # Occlusion-aware components
  occlusion:
    detection:
      enabled: true
      type: "learnable"  # "learnable" or "ground_truth"
      soft_masking: true  # continuous weights for gradient flow
    visibility_scoring:
      enabled: true
      temporal_smoothing: true
      smoothing_weight: 0.1
  
  # Temporal modeling
  temporal:
    type: "bi_convlstm"  # "convlstm", "bi_convlstm", "tcn", "transformer"
    hidden_dim: 256
    num_layers: 2
    # TCN specific
    tcn_channels: [256, 256, 256]
    tcn_kernel_size: 3
    # Transformer specific
    num_heads: 8
    num_encoder_layers: 2
    dropout: 0.1
  
  # Fusion
  fusion:
    type: "pyramid"  # "pyramid", "fpn", "late"
    pyramid_levels: [1, 2, 4]

# Training
training:
  batch_size: [8, 16]
  total_iterations: 40000
  optimizer:
    type: "sgd"
    lr: 0.1
    momentum: 0.9
    weight_decay: 5.0e-4
  scheduler:
    type: "step"
    milestones: [20000, 30000]
    gamma: 0.1
  warmup:
    iterations: 500
    type: "linear"
  gradient_clip:
    max_norm: 10.0
  checkpoint_interval: 5000

# Loss
loss:
  triplet:
    margin: 0.2
    mining: "hard"
    weight: 1.0
  center:
    weight: 0.005
    momentum: 0.5
  consistency:
    weight: 0.1
    enabled: true  # occlusion-aware consistency regularization

# Augmentation
augmentation:
  random_occlusion:
    enabled: true
    probability: 0.5
    size_range: [0.1, 0.5]
    shapes: ["rectangle", "ellipse", "freeform"]
    position: "random"  # "random" or "part_biased"
  affine:
    enabled: true
    rotation: 15
    scale: [0.9, 1.1]
    shear: 0.1
    translation: 0.05
  temporal:
    enabled: true
    frame_drop_prob: 0.1
    frame_dup_prob: 0.1

# Evaluation
evaluation:
  metrics: ["rank1", "rank5", "cmc", "map"]
  visualization: true
  attention_maps: true

# Logging
logging:
  backend: "wandb"
  project: "gait-recognition"
  run_name: "occaware-resnet50-biconvlstm"
  log_interval: 100

# Hardware
hardware:
  device: "cuda"
  mixed_precision: true
  compile: true
